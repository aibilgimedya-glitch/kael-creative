<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .e404{text-align:center;max-width:640px;margin:0 auto;}
  .e404 .big{
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-weight:900;font-size:clamp(140px,28vw,320px);line-height:.85;
    color:var(--cream);letter-spacing:-0.04em;
    background:linear-gradient(180deg,var(--cream) 0%,var(--accent) 100%);

  }

  .e404 .cta-row{
    display:inline-flex;flex-wrap:wrap;gap:12px;justify-content:center;
  }
  .e404 .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 28px;
    font-family:'DM Mono',ui-monospace,monospace;
    font-size:11px;letter-spacing:0.2em;text-decoration:none;
    background:var(--accent);color:#fff;border:1px solid var(--accent);
    transition:.3s;
  }
  .e404 .btn:hover{background:transparent;color:var(--accent);}
  .e404 .btn.ghost{background:transparent;color:var(--cream);border-color:var(--border);}
  .e404 .btn.ghost:hover{color:var(--accent);border-color:var(--accent);}
</style>
